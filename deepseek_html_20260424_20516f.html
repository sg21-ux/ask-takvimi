    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 50%, #FFC0CB 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 64, 129, 0.2);
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1.5s infinite;
            cursor: pointer;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
        }

        .heart:active {
            animation: heartPop 0.3s ease;
        }

        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        .date {
            color: #FF69B4;
            font-size: 14px;
            font-style: italic;
            margin: 15px 0;
            opacity: 0.8;
        }

        .divider {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFB6C1, transparent);
            margin: 10px auto;
        }

        .poem-title {
            color: #C2185B;
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0 30px 0;
            text-shadow: 2px 2px 4px rgba(194, 24, 91, 0.1);
        }

        .poem-content {
            color: #333;
            font-size: 18px;
            line-height: 1.8;
            margin: 20px 0;
            min-height: 150px;
            white-space: pre-line;
            font-style: italic;
        }

        .poet {
            color: #FF69B4;
            font-size: 16px;
            font-style: italic;
            margin: 20px 0;
        }

        .new-poem-btn {
            background: linear-gradient(45deg, #FF4081, #FF80AB);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Georgia', serif;
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 250px;
        }

        .new-poem-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(255, 64, 129, 0.2);
        }

        .love-counter {
            background: rgba(255, 64, 129, 0.1);
            border-radius: 20px;
            padding: 10px;
            margin-top: 20px;
            color: #C2185B;
            font-size: 14px;
        }

        .sparkles {
            position: fixed;
            pointer-events: none;
            animation: sparkle 1s ease-out forwards;
            font-size: 20px;
        }

        @keyframes sparkle {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart" id="heart" onclick="createSparkles()">💕</div>
        <div class="date" id="date"></div>
        <div class="divider"></div>
        <div class="poem-title" id="poemTitle">Yükleniyor...</div>
        <div class="poem-content" id="poemContent">Aşk dolu şiiriniz hazırlanıyor...</div>
        <div class="poet" id="poet"></div>
        <button class="new-poem-btn" onclick="newPoem()">💝 Yeni Şiir Getir</button>
        <div class="love-counter">
            💑 <span id="daysTogether">Her gün yeni bir aşk...</span>
        </div>
    </div>

    <script>
        // EVLİLİK TARİHİNİZ - 18 Mayıs 2023
        const weddingDate = new Date(2023, 4, 18); // Ay 0'dan başlar, 4 = Mayıs
        
        // Şiir Veritabanı
        const poems = [
            // Kendi özel şiirlerin
            {
                title: "Sen",
                content: "Sen benim yarim olmasan da,\nYüreğimde taht kurdun.\nHer nefes alışımda,\nKalbimdesin, ruhumdasın...\n\nGözlerin bir deniz,\nBen o denizde kayboldum.\nGülüşün bir güneş,\nBen o güneşte ısındım.",
                poet: "Sevgili Eşime 💑"
            },
            {
                title: "Aşk-ı Kalbim",
                content: "Gözlerine baktığımda,\nZaman durur sanki.\nEllerini tuttuğumda,\nDünya döner başımda.\n\nSeninle her anım,\nBir ömre bedel.\nSeninle her nefes,\nCennetten bir esinti.",
                poet: "Kalbimin Sahibine 💖"
            },
            {
                title: "Sevgili",
                content: "Bir gülüşün var ki,\nBaharları kıskandırır.\nBir bakışın var ki,\nGüneşi utandırır.\n\nVarlığın huzur,\nYokluğun özlem.\nSen benim en güzel,\nEn özel hediye...",
                poet: "Hayat Arkadaşıma 💝"
            },
            
            // Ömer Hayyam Rubaileri
            {
                title: "Aşk ve Şarap",
                content: "Sevda ile geçir ömrünü,\nAşk ile dolsun her anın.\nYarın ne olur bilinmez,\nBugün sev elinden geldiğince.",
                poet: "Ömer Hayyam 🍷"
            },
            {
                title: "Gül ve Bülbül",
                content: "Gül yaprağına yazdım seni,\nBülbül okusun diye.\nRüzgar alsa da kokunu,\nKalbimde saklarım seni.",
                poet: "Ömer Hayyam 🌹"
            },
            {
                title: "Zaman ve Aşk",
                content: "Geçer gider bu ömür dediğin,\nBir rüzgardır eser geçer.\nSev ki kalsın bir iz geriye,\nAşk ki zamana bedel.",
                poet: "Ömer Hayyam ⌛"
            },
            {
                title: "Can Yoldaşı",
                content: "Bir can yoldaşı ara kendine,\nDerdini dökecek bir dost.\nYalnızlık zehirdir insana,\nAşk ile gel bu dünyada.",
                poet: "Ömer Hayyam 💫"
            },
            
            // Fuzuli Gazelleri
            {
                title: "Leyla'yı Ararken",
                content: "Aşk derdiyle hoşem el çek ilacımdan tabib,\nKılma derman kim helakim zehri dermanındadır.\n\nAşk derdiyle mutluyum, çekme elini ilacımdan doktor,\nBana ilaç verme ki benim ölümüm senin dermanındadır.",
                poet: "Fuzuli 🖋️"
            },
            {
                title: "Beni Candan",
                content: "Beni candan usandırdı cefadan yar usanmaz mı,\nFelekler yandı ahımdan muradım şem'i yanmaz mı.\n\nCanımdan bıktırdı beni, cefadan yar bıkmaz mı,\nFelekler yandı ahımdan, muradımın mumu yanmaz mı.",
                poet: "Fuzuli 🕯️"
            },
            {
                title: "Su Kasidesi",
                content: "Saçma ey göz eşkden gönlümdeki odlara su,\nKim bu denlü dutuşan odlara kılmaz çare su.\n\nEy göz, gönlümdeki ateşlere gözyaşından su saçma,\nKi bu kadar tutuşan ateşlere su fayda etmez.",
                poet: "Fuzuli 💧"
            },
            
            // Baki Divanından
            {
                title: "Gül Yüzlüm",
                content: "Gül yüzünde gördüm âşıklığımı,\nGonca güldü, ben ağladım halime.\nServi boyun salınırken aheste,\nDüştü gönlüm böyle bir hayalime.",
                poet: "Baki 🌺"
            },
            {
                title: "Sevgiliye",
                content: "Cân verme derd-i aşk ile cânân içindir,\nZahm-ı dil-i hazîn ile dermân içindir.\n\nAşk derdiyle can verme, sevgili içindir,\nHüzünlü gönlün yarası da derman içindir.",
                poet: "Baki 💔"
            },
            {
                title: "Gönül Kuşu",
                content: "Ey gönül kuşu, uçma bu gülşenden öte,\nGül biter ateş-i aşkın dikeninden öte.\nBülbül-i şeyda gibi feryad et ki,\nYar duyar seni bu gülşenden öte.",
                poet: "Baki 🕊️"
            },
            
            // Hafız-ı Şirazi Gazelleri
            {
                title: "Aşk Yolu",
                content: "Aşk yolunda can vermek,\nÂşıklara sermayedir.\nYarin bir bakışı bile,\nBin ömre bedeldir.",
                poet: "Hafız-ı Şirazi ✨"
            },
            {
                title: "Sevgilinin Saçı",
                content: "Sevgilinin saçı gibi,\nDağınıktır gönlümüz.\nAma o dağınıklıkta,\nBin düzen gizlidir.",
                poet: "Hafız-ı Şirazi 💫"
            },
            {
                title: "Gül Bahçesi",
                content: "Gül bahçesinde yürürken,\nSevgiliyi andım bugün.\nHer gül onun kokusunu taşır,\nHer diken ayrılığını.",
                poet: "Hafız-ı Şirazi 🌸"
            },
            {
                title: "Şarap ve Aşk",
                content: "Şarap içme, aşk ile sarhoş ol,\nKi asıl sarhoşluk aşktadır.\nMeyhane değil, sevgilinin gözleri,\nÂşığın mekanıdır.",
                poet: "Hafız-ı Şirazi 🍷"
            },
            
            // Modern şiirler
            {
                title: "Yıldızlara",
                content: "Gökyüzünde yıldızlar,\nSeni fısıldar bana.\nAy bile kıskanır,\nBu aşkı gördüğünde.\n\nSen ve ben bir bütün,\nAyrılmaz bir parçayız.\nSonsuza dek sürecek,\nBu aşkın adı biz...",
                poet: "Sonsuz Aşkıma 💘"
            },
            {
                title: "Sabah Güneşi",
                content: "Her sabah uyandığımda,\nİlk aklıma gelen sensin.\nGünaydın demek bile,\nSeninle güzel sevgilim.\n\nKahvemde tadın var,\nEkmeğimde kokun.\nHayatımın her anında,\nSen varsın biliyorum.",
                poet: "Günaydın Aşkım 🌅"
            },
            {
                title: "Ellerin",
                content: "Ellerin ellerimde,\nSıcacık ve yumuşak.\nParmakların parmaklarımda,\nHayat kadar gerçek.\n\nBu eller tuttu beni,\nDüşerken kaldırdı.\nBu eller sevdi beni,\nÖmrüme ömür kattı.",
                poet: "El Ele 💑"
            }
        ];

        // Evlilik gün sayısını hesapla (HER ZAMAN GÜNCEL)
        function calculateDaysSinceWedding() {
            const now = new Date();
            const diffTime = now.getTime() - weddingDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        // Birlikte geçen günleri güncelle
        function updateDaysTogether() {
            const days = calculateDaysSinceWedding();
            document.getElementById('daysTogether').textContent = 
                `Evliliğimizin ${days}. gününde her anımız şiir... 💝`;
        }

        // Bugünün tarihini ayarla
        function setDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('tr-TR', options);
            document.getElementById('date').textContent = '📅 ' + dateStr;
        }

        // Bugünün şiirini getir
        function getDailyPoem() {
            const now = new Date();
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            return poems[dayOfYear % poems.length];
        }

        // Rastgele şiir getir
        function getRandomPoem() {
            return poems[Math.floor(Math.random() * poems.length)];
        }

        // Şiiri göster
        function displayPoem(poem) {
            document.getElementById('poemTitle').textContent = poem.title;
            document.getElementById('poemContent').textContent = poem.content;
            document.getElementById('poet').textContent = '— ' + poem.poet;
            
            // Animasyon efekti
            const content = document.getElementById('poemContent');
            content.style.opacity = '0';
            content.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                content.style.transition = 'all 0.5s ease';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 50);
        }

        // Yeni şiir butonu
        function newPoem() {
            const poem = getRandomPoem();
            displayPoem(poem);
            createSparkles();
            
            // Dokunma geri bildirimi
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Kalp patlaması efekti
        function createSparkles() {
            const emojis = ['💕', '💖', '💝', '💗', '✨', '💫', '🌸', '❤️'];
            const heart = document.getElementById('heart');
            const rect = heart.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('span');
                sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                sparkle.className = 'sparkles';
                sparkle.style.position = 'fixed';
                sparkle.style.left = centerX + (Math.random() - 0.5) * 100 + 'px';
                sparkle.style.top = centerY + 'px';
                sparkle.style.fontSize = (15 + Math.random() * 15) + 'px';
                sparkle.style.animation = `sparkle ${0.5 + Math.random() * 0.5}s ease-out forwards`;
                
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        // Sayfa yüklendiğinde
        window.onload = function() {
            setDate();
            updateDaysTogether();
            const dailyPoem = getDailyPoem();
            displayPoem(dailyPoem);
            
            // Servis Worker kaydı (PWA için)
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js').catch(() => {});
                });
            }
        };

        // Her dakika günü kontrol et ve sayacı güncelle
        setInterval(() => {
            const now = new Date();
            // Günde bir kez, gece yarısı şiiri güncelle
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                const dailyPoem = getDailyPoem();
                displayPoem(dailyPoem);
                setDate();
            }
            // Her dakika gün sayacını güncelle
            updateDaysTogether();
        }, 60000); // Her 1 dakikada bir kontrol et
    </script>
</body>
</html>
